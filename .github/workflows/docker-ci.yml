name: Tuberia de Integracion Continua (CI)

on:
  push:
    branches: [ "principal" ]

jobs:
  compilar-contenedor:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo de GitHub
      uses: actions/checkout@v4

    - name: Construir imagen de Docker
      run: |
        docker build -t mi-api-seguridad:latest .
